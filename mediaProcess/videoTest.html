<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Display Webcam Stream</title>
    <style>
        html,body{margin:0;padding:0;}
        *{box-sizing:border-box}
        @media screen and (min-width:720px){
            #videoElement, #mirrored {
                width: 500px;
                height: 375px;
                background-color: #666;
                display: inline-block;
            }
        }
        @media screen and (max-width:719px){
            #videoElement, #mirrored {
                width: calc(100vw *(700 / 720));
                height: calc(100vw *(1244 / 720));
                background-color: #666;
                display: inline-block;
            }
        }
      
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no,minimum-scale=1">
  </head>
  <body>
	  <video autoplay="true" id="videoElement"></video>
      <canvas class="canvas" id="mirrored"></canvas>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    new App();
    })
  
    class App {
        constructor() {

            const video = document.querySelector("#videoElement");

            if (navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({  audio:true,video: { facingMode:  "environment"  }
            })
                .then( (stream) => { // function 의 this와 화살표 함수의 this 가 다름
                video.srcObject = stream;
                })
                .catch(function (error) {
                console.log("Something went wrong!");
                console.log(error);
                return;
                });
            }

            video.addEventListener( "loadedmetadata", () => {
            window.requestAnimationFrame(this.draw.bind(this));
            });
        }

        draw(t) {

            window.requestAnimationFrame(this.draw.bind(this));
            
            const canvas = document.querySelector("#mirrored");
            const video = document.querySelector("#videoElement");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const ctx = canvas.getContext('2d');
            ctx.translate(video.videoWidth, 0);
            ctx.scale(-1,1);
            ctx.drawImage(video, 0, 0, 
                video.videoWidth, 
                video.videoHeight);  
            
        }
    }
  </script>
</html>
